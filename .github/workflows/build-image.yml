name: Build image (GHCR)

# Constrói a imagem Docker e publica no GHCR (request-based, sem segredos na
# imagem; envs ficam no runtime). Agora dispara automaticamente a cada push na
# main e, se houver BLITZ_API_KEY, aciona o redeploy na Blitz.cloud via CLI
# oficial — tornando o deploy ponta-a-ponta automático.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pratoja:cloudrun
            ghcr.io/${{ github.repository_owner }}/pratoja:latest

  redeploy-blitz:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy on Blitz.cloud (if key present)
        env:
          BLITZ_API_KEY: ${{ secrets.BLITZ_API_KEY }}
          # Nome/endereço do app na Blitz; ajustável via variável de repositório.
          BLITZ_APP: ${{ vars.BLITZ_APP || 'pratoja' }}
        run: |
          if [ -z "$BLITZ_API_KEY" ]; then
            echo "::notice::BLITZ_API_KEY ausente. Pulei o redeploy automático; a Blitz ainda pode atualizar sozinha pelo auto-update noturno da tag :latest."
            exit 0
          fi
          curl -fsSL https://blitz.cloud/cli/blitz.js -o /tmp/blitz.js
          echo "Redeploy da imagem :latest no app '$BLITZ_APP'..."
          # Repõe a tag móvel :latest (puxa o digest recém-publicado) e reinicia.
          node /tmp/blitz.js deploy image "ghcr.io/${{ github.repository_owner }}/pratoja" --tag latest --address "$BLITZ_APP" --yes --json \
            || node /tmp/blitz.js restart "$BLITZ_APP" --yes
