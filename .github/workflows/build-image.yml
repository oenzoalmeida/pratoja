name: Build image (GHCR)

# Constrói a imagem Docker e publica no GHCR para deploy no Cloud Run
# (request-based, sem segredos na imagem; envs ficam no runtime).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pratoja:cloudrun
            ghcr.io/${{ github.repository_owner }}/pratoja:latest
