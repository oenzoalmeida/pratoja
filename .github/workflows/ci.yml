name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: bash ./mvnw --batch-mode --no-transfer-progress test

  # Validação em PostgreSQL real: sobe postgres:16 como serviço, roda a app/suite
  # com o perfil postgres (migrations V1-V8 de db/migration + db/migration-postgres).
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pratoja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRATOJA_ADMIN_PASSWORD: SeederAdmin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test (PostgreSQL 16)
        env:
          SPRING_PROFILES_ACTIVE: postgres
          DATABASE_URL: jdbc:postgresql://localhost:5432/pratoja
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
        run: bash ./mvnw --batch-mode --no-transfer-progress test
