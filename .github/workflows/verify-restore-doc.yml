name: Verificar procedimento de restauração (docs)

# Valida docs/restauracao-backup.md com dados sintéticos e PostgreSQL 17 descartável.
# Sem dados de produção, sem segredos, sem deploy.
on:
  pull_request:
    paths:
      - 'docs/restauracao-backup.md'
      - '.github/workflows/verify-restore-doc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Criar banco de origem sintético (postgres 17)
        run: |
          set -euo pipefail
          SRC="pratoja-src-$GITHUB_RUN_ID"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          docker run -d --name "$SRC" -e POSTGRES_PASSWORD=src-ci -e POSTGRES_USER=pratoja -e POSTGRES_DB=pratoja postgres:17
          until docker exec "$SRC" pg_isready -U pratoja -d pratoja; do sleep 1; done
          docker exec "$SRC" psql -U pratoja -d pratoja -v ON_ERROR_STOP=1 -c "
            create table flyway_schema_history(installed_rank int primary key, version text, description text);
            insert into flyway_schema_history values (1,'1','init'),(2,'2','demo');
            create table stores(id serial primary key, slug text not null);
            insert into stores(slug) select 'loja-' || g from generate_series(1,5) g;"

      - name: Gerar dump no formato custom (-Fc), como o backup.sh
        run: |
          set -euo pipefail
          docker exec "$SRC" pg_dump -U pratoja -Fc pratoja > "$RUNNER_TEMP/copia.dump"
          ls -l "$RUNNER_TEMP/copia.dump"

      - name: Confirmar que psql NÃO restaura dump custom (afirmação do doc)
        run: |
          set -uo pipefail
          if docker exec -i "$SRC" psql -v ON_ERROR_STOP=1 -U pratoja -d postgres < "$RUNNER_TEMP/copia.dump" > /dev/null 2>&1; then
            echo "psql aceitou o dump custom: a afirmação do documento está errada"; exit 1
          fi
          echo "ok: psql rejeita o dump custom"

      - name: Procedimento do documento (banco isolado, pg_restore)
        run: |
          set -euo pipefail
          DUMP="$RUNNER_TEMP/copia.dump"
          NAME="pratoja-verify-$(date +%s)"
          PW="$(openssl rand -hex 16)"

          docker run -d --name "$NAME" -e POSTGRES_PASSWORD="$PW" -e POSTGRES_USER=pratoja -e POSTGRES_DB=pratoja postgres:17
          until docker exec "$NAME" pg_isready -U pratoja -d pratoja; do sleep 1; done

          docker exec -i "$NAME" pg_restore --exit-on-error --no-owner --no-privileges -U pratoja -d pratoja < "$DUMP"

          docker exec "$NAME" psql -U pratoja -d pratoja -c '\dt'
          FLY=$(docker exec "$NAME" psql -U pratoja -d pratoja -tAc 'select count(*) from flyway_schema_history;')
          STORES=$(docker exec "$NAME" psql -U pratoja -d pratoja -tAc 'select count(*) from stores;')
          echo "flyway=$FLY stores=$STORES"
          [ "$FLY" = "2" ] && [ "$STORES" = "5" ]

          docker rm -f "$NAME"

      - name: Limpeza do banco de origem
        if: always()
        run: docker rm -f "$SRC" || true
