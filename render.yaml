services:
  - type: web
    name: pratoja
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PRATOJA_DEMO_MODE
        value: "false"
      # Segredo: o valor é informado no painel do Render (nunca versionado).
      - key: PRATOJA_ADMIN_PASSWORD
        sync: false
      # Opcional: cria o PLATFORM_ADMIN no boot quando definida (painel /platform na Fase 5).
      - key: PRATOJA_PLATFORM_ADMIN_PASSWORD
        sync: false
      # Banco persistente PostgreSQL (Supabase free). Profile postgres = application-postgres.properties.
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # DATABASE_URL = string JDBC completa, ex.: jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # E-mails transacionais: DESLIGADO por padrão — a produção NÃO muda de comportamento
      # até o mail ser habilitado explicitamente com as credenciais SMTP no painel.
      - key: PRATOJA_MAIL_ENABLED
        value: "false"
      # SMTP (ex.: Brevo smtp-relay.brevo.com:587). Valores definidos no painel do Render.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: "notificacoes@pratoja.app"
      # URL pública usada nos links dos e-mails (ex.: https://pratoja.onrender.com)
      - key: MAIL_BASE_URL
        sync: false
