spring.application.name=pratoja
spring.datasource.url=jdbc:h2:file:./data/pratoja;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.whitelabel.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
pratoja.demo-mode=true
pratoja.demo-reset-email=cliente@pratoja.com.br
pratoja.delivery-fee=6.00
pratoja.upload-dir=./data/uploads
