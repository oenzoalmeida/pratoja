spring.application.name=pratoja
spring.datasource.url=jdbc:h2:file:./data/pratoja;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.whitelabel.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# URL pública absoluta da aplicação (usada em og:image/twitter:image para crawlers externos).
pratoja.public-base-url=${PUBLIC_BASE_URL:https://pratoja.oenzoalmeida.blitz.cloud}
# Modo demonstração: DESLIGADO por padrão. Ative explicitamente com PRATOJA_DEMO_MODE=true
# apenas em ambientes de demonstração (cria a conta cliente@pratoja.com.br, de senha conhecida).
pratoja.demo-mode=${PRATOJA_DEMO_MODE:false}
pratoja.demo-reset-email=cliente@pratoja.com.br
pratoja.delivery-fee=6.00
pratoja.upload-dir=./data/uploads
spring.flyway.locations=classpath:db/migration,classpath:db/migration-h2

# ---- E-mails transacionais (outbox + SMTP) ----
# Default: DESLIGADO. Nenhum e-mail real é enviado e a recuperacao de senha mantem o demoLink em demo-mode.
pratoja.mail.enabled=${PRATOJA_MAIL_ENABLED:false}
# URL base usada nos links dos e-mails (ex.: https://pratoja.app)
pratoja.mail.base-url=${MAIL_BASE_URL:http://localhost:8080}
pratoja.mail.from=${MAIL_FROM:notificacoes@pratoja.app}
# Intervalo do scheduler que processa o outbox (apenas quando pratoja.mail.enabled=true)
pratoja.mail.poll-interval-ms=${MAIL_POLL_INTERVAL_MS:30000}
# SMTP via ambiente apenas (nunca versionar credenciais). Suporta Brevo: smtp-relay.brevo.com:587.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---- Rate limit da recuperação de senha (in-memory, janela fixa) ----
# Vale SEMPRE (independe de pratoja.mail.enabled): protege geração de tokens e o flood de outbox.
# Ao atingir o limite a resposta continua 200 com a MESMA mensagem genérica (anti-enumeração):
# nada é processado/enfileirado. Estado em memória da instância (restart/redeploy zera).
# Por IP: buckets separados para POST /recuperar-senha e POST /redefinir-senha.
pratoja.recovery.rate-limit.max-attempts-per-ip=${PRATOJA_RATE_LIMIT_IP_MAX:5}
pratoja.recovery.rate-limit.window-minutes=${PRATOJA_RATE_LIMIT_IP_WINDOW_MINUTES:10}
# Por e-mail (normalizado, case-insensitive): limita tokens gerados/enqueued por conta.
pratoja.recovery.rate-limit.max-per-email=${PRATOJA_RATE_LIMIT_EMAIL_MAX:3}
pratoja.recovery.rate-limit.email-window-minutes=${PRATOJA_RATE_LIMIT_EMAIL_WINDOW_MINUTES:60}

# ---- Rate limit de autenticação (in-memory, janela fixa) ----
# Login conta apenas FALHAS (sucesso zera os contadores): protege contra força bruta sem
# bloquear usuário legítimo atrás de NAT. Bloqueio responde 302 /login?limite antes de autenticar.
pratoja.login.rate-limit.max-failures-per-ip=${PRATOJA_LOGIN_RATE_LIMIT_MAX_FAILURES_PER_IP:20}
pratoja.login.rate-limit.window-minutes=${PRATOJA_LOGIN_RATE_LIMIT_WINDOW_MINUTES:10}
pratoja.login.rate-limit.max-failures-per-email=${PRATOJA_LOGIN_RATE_LIMIT_MAX_FAILURES_PER_EMAIL:8}
pratoja.login.rate-limit.email-window-minutes=${PRATOJA_LOGIN_RATE_LIMIT_EMAIL_WINDOW_MINUTES:30}
# Quantos proxies confiáveis separam a app do cliente (0 = ignorar X-Forwarded-For). Deve
# corresponder à topologia real do deploy; com proxy inexistente, manter 0 para não aceitar header forjado.
pratoja.security.trusted-proxy-hops=${PRATOJA_TRUSTED_PROXY_HOPS:1}
# Cadastro conta TENTATIVAS por IP (contém criação em massa de contas).
pratoja.signup.rate-limit.max-attempts-per-ip=${PRATOJA_SIGNUP_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:50}
pratoja.signup.rate-limit.window-minutes=${PRATOJA_SIGNUP_RATE_LIMIT_WINDOW_MINUTES:60}

# Integracao Mercado Pago (Pix por loja, multitenant). Segredos SOMENTE por ambiente.
pratoja.mp.client-id=${MP_CLIENT_ID:}
pratoja.mp.client-secret=${MP_CLIENT_SECRET:}
pratoja.mp.webhook-secret=${MP_WEBHOOK_SECRET:}
pratoja.mp.api-base-url=${MP_API_BASE_URL:https://api.mercadopago.com}
pratoja.mp.auth-base-url=${MP_AUTH_BASE_URL:https://auth.mercadopago.com}
pratoja.mp.default-mode=${MP_DEFAULT_MODE:TEST}
# AES-256 (base64, 32 bytes) para tokens OAuth das lojas; gerar com: openssl rand -base64 32
pratoja.payments.crypto-key=${PRATOJA_PAYMENTS_CRYPTO_KEY:}

# ---- Rate limit do fluxo de pedido (in-memory, janela fixa, por conta) ----
# Checkout: contém spam de pedidos falsos contra o painel das lojas.
pratoja.checkout.rate-limit.max-attempts=${PRATOJA_CHECKOUT_RATE_LIMIT_MAX:10}
pratoja.checkout.rate-limit.window-minutes=${PRATOJA_CHECKOUT_RATE_LIMIT_WINDOW_MINUTES:10}
# Pagamento com cartão e verificação manual: cada tentativa chama a API do Mercado Pago.
pratoja.payment.card.rate-limit.max-attempts=${PRATOJA_CARD_RATE_LIMIT_MAX:6}
pratoja.payment.card.rate-limit.window-minutes=${PRATOJA_CARD_RATE_LIMIT_WINDOW_MINUTES:10}
pratoja.payment.verify.rate-limit.max-attempts=${PRATOJA_VERIFY_RATE_LIMIT_MAX:12}
pratoja.payment.verify.rate-limit.window-minutes=${PRATOJA_VERIFY_RATE_LIMIT_WINDOW_MINUTES:5}
