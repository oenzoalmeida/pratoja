<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes — Admin PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/admin-ui.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('customers')}"></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">Base de clientes</span><h1>Clientes</h1></div><article class="metric" style="min-width:150px"><span class="metric-icon"><svg th:replace="~{fragments :: icon('users','')}"></svg></span><div><span>Cadastrados</span><strong th:text="${customers.size()}"></strong></div></article></header>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Cadastro</th><th>Situação</th></tr></thead><tbody>
<tr th:each="c:${customers}"><td th:text="${c.name}">Nome</td><td th:text="${c.email}">E-mail</td><td th:text="${c.phone}">Telefone</td><td th:text="${#temporals.format(c.createdAt,'dd/MM/yyyy')}">00/00/0000</td><td><span class="status-pill" th:style="${c.active} ? '' : 'background:#ffebe7;color:#9a271b'" th:text="${c.active} ? 'Ativo' : 'Inativo'">Ativo</span></td></tr>
</tbody></table></div>
<div class="empty-inline" th:if="${customers.empty}"><svg th:replace="~{fragments :: icon('users','')}"></svg><div><strong>Nenhum cliente cadastrado</strong><p>Os clientes aparecerão aqui após o primeiro cadastro.</p></div></div>
</main></div></body></html>
