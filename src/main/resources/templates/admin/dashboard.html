<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/admin-ui.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('dashboard')}"></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">Operação de hoje</span><h1>Olá, equipe PratoJá</h1></div><a class="btn btn-primary" href="/admin/pedidos"><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg>Ver pedidos</a></header>
<section class="metrics"><article class="metric"><span class="metric-icon"><svg th:replace="~{fragments :: icon('shopping-bag','')}"></svg></span><div><span>Pedidos do dia</span><strong th:text="${today}"></strong></div></article><article class="metric"><span class="metric-icon"><svg th:replace="~{fragments :: icon('chart','')}"></svg></span><div><span>Faturamento concluído</span><strong th:text="${#numbers.formatCurrency(revenue)}"></strong></div></article><article class="metric"><span class="metric-icon"><svg th:replace="~{fragments :: icon('clock','')}"></svg></span><div><span>Pendentes</span><strong th:text="${pending}"></strong></div></article><article class="metric"><span class="metric-icon"><svg th:replace="~{fragments :: icon('chef-hat','')}"></svg></span><div><span>Em preparo</span><strong th:text="${preparing}"></strong></div></article><article class="metric"><span class="metric-icon"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg></span><div><span>Concluídos</span><strong th:text="${done}"></strong></div></article></section>
<div class="section-bar"><div><span class="section-kicker">Movimentação</span><h2>Pedidos recentes</h2></div><a class="text-link" href="/admin/pedidos">Ver todos <svg th:replace="~{fragments :: icon('arrow-right','')}"></svg></a></div>
<div class="table-wrap responsive-table"><table class="data-table"><thead><tr><th>Pedido</th><th>Horário</th><th>Status</th><th>Tipo</th><th>Total</th></tr></thead><tbody><tr th:each="o:${recent}"><td data-label="Pedido"><a class="table-link" th:href="@{/admin/pedidos/{id}(id=${o.id})}" th:text="${o.number()}"></a></td><td data-label="Horário" th:text="${#temporals.format(o.createdAt,'HH:mm')}"></td><td data-label="Status"><span class="status-pill" th:text="${o.statusLabel()}"></span></td><td data-label="Tipo" th:text="${o.fulfillmentType.name() == 'DELIVERY' ? 'Entrega' : 'Retirada'}"></td><td data-label="Total" class="table-price" th:text="${#numbers.formatCurrency(o.total)}"></td></tr><tr class="table-empty" th:if="${recent.empty}"><td colspan="5"><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg>Nenhum pedido registrado ainda.</td></tr></tbody></table></div>
</main></div></body></html>
