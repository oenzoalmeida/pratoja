<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(active)" class="admin-sidebar">
  <a class="brand brand-light" href="/admin"><span class="brand-mark">P</span><span>Prato<span>Já</span></span></a>
  <nav aria-label="Navegação administrativa">
    <a href="/admin" th:classappend="${active=='dashboard'}?'active'"><svg th:replace="~{fragments :: icon('layout-dashboard','')}"></svg><span>Visão geral</span></a>
    <a href="/admin/pedidos" th:classappend="${active=='orders'}?'active'"><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg><span>Pedidos</span></a>
    <a href="/admin/produtos" th:classappend="${active=='products'}?'active'"><svg th:replace="~{fragments :: icon('package','')}"></svg><span>Cardápio</span></a>
    <a href="/admin/clientes" th:classappend="${active=='customers'}?'active'"><svg th:replace="~{fragments :: icon('users','')}"></svg><span>Clientes</span></a>
    <a href="/admin/relatorios" th:classappend="${active=='reports'}?'active'"><svg th:replace="~{fragments :: icon('chart','')}"></svg><span>Relatórios</span></a>
    <a href="/" target="_blank"><svg th:replace="~{fragments :: icon('eye','')}"></svg><span>Ver loja</span></a>
  </nav>
  <form action="/logout" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-light full"><svg th:replace="~{fragments :: icon('log-out','')}"></svg>Sair</button></form>
</aside>
</body>
</html>
