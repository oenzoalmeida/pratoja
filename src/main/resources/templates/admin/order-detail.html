<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido — Admin PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/admin-ui.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('orders')}"></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">Detalhes</span><h1 th:text="'Pedido '+${order.number()}"></h1></div><a class="back" href="/admin/pedidos"><svg th:replace="~{fragments :: icon('arrow-left','')}"></svg>Voltar</a></header><div class="alert success" th:if="${success}"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg><span th:text="${success}"></span></div><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div>
<div class="order-detail-grid"><section class="panel"><div class="panel-heading"><span class="heading-icon"><svg th:replace="~{fragments :: icon('shopping-bag','')}"></svg></span><div><small>Resumo</small><h2>Itens</h2></div></div><div class="order-line" th:each="item:${order.items}"><span th:text="${item.quantity}+'× '+${item.name}"></span><strong th:text="${#numbers.formatCurrency(item.total)}"></strong><small th:if="${!item.options.empty}" th:text="${#strings.listJoin(item.options,', ')}"></small><small th:if="${!#strings.isEmpty(item.notes)}" th:text="'Obs.: '+${item.notes}"></small></div><hr><div class="order-total"><span>Total</span><strong th:text="${#numbers.formatCurrency(order.total)}"></strong></div></section>
<section class="panel service-panel"><div class="panel-heading"><span class="heading-icon"><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg></span><div><small>Operação</small><h2>Atendimento</h2></div></div><div class="service-status"><span>Status atual</span><strong class="status-pill" th:text="${order.statusLabel()}"></strong></div><p class="detail-row"><svg th:replace="~{fragments :: icon('map-pin','')}"></svg><span th:text="${order.address?:'Retirada no restaurante'}"></span></p><p class="detail-row"><svg th:replace="~{fragments :: icon('credit-card','')}"></svg><span th:text="'Pagamento: '+${order.paymentMethod}"></span></p><p class="detail-row" th:if="${!#strings.isEmpty(order.notes)}"><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg><span th:text="'Observação: '+${order.notes}"></span></p>
<form class="status-form" th:action="@{/admin/pedidos/{id}/status(id=${order.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Novo status<select name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s.name() == 'RECEIVED' ? 'Pedido recebido' : s.name() == 'CONFIRMED' ? 'Confirmado' : s.name() == 'PREPARING' ? 'Em preparo' : s.name() == 'READY' ? 'Pronto' : s.name() == 'OUT_FOR_DELIVERY' ? 'Saiu para entrega' : s.name() == 'DELIVERED' ? 'Entregue' : 'Cancelado'}"></option></select></label><button class="btn btn-primary"><svg th:replace="~{fragments :: icon('refresh','')}"></svg>Atualizar status</button></form></section></div>
</main></div></body></html>
