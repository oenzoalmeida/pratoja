<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos — Admin PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/admin-orders.js"></script><script defer src="/js/admin-ui.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('orders')}"></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">Tempo real</span><h1>Gestão de pedidos</h1></div><span class="live"><i></i>Ao vivo</span></header>
<div class="filter-bar" aria-label="Filtrar quadro"><button class="filter-chip active" type="button" data-board-filter="all">Todos</button><button class="filter-chip" type="button" data-board-filter="new">Novos</button><button class="filter-chip" type="button" data-board-filter="preparing">Em preparo</button><button class="filter-chip" type="button" data-board-filter="delivery">Prontos e entrega</button><button class="filter-chip" type="button" data-board-filter="done">Concluídos</button></div>
<section class="order-board"><div class="order-column" data-board-column="new"><h3><span><svg th:replace="~{fragments :: icon('bell','')}"></svg>Novos pedidos</span><b th:text="${#lists.size(orders.?[status.name() == 'RECEIVED' or status.name() == 'CONFIRMED'])}"></b></h3><a class="order-card" th:each="o:${orders}" th:if="${o.status.name()=='RECEIVED' or o.status.name()=='CONFIRMED'}" th:href="@{/admin/pedidos/{id}(id=${o.id})}"><div><strong th:text="${o.number()}"></strong><span class="status-pill" th:text="${o.statusLabel()}"></span></div><span class="order-card-price" th:text="${#numbers.formatCurrency(o.total)}"></span><small><svg th:replace="~{fragments :: icon('clock','')}"></svg><span th:text="${#temporals.format(o.createdAt,'HH:mm')}"></span></small></a><p class="column-empty">Nenhum pedido nesta etapa.</p></div>
<div class="order-column" data-board-column="preparing"><h3><span><svg th:replace="~{fragments :: icon('chef-hat','')}"></svg>Em preparo</span><b th:text="${#lists.size(orders.?[status.name() == 'PREPARING'])}"></b></h3><a class="order-card" th:each="o:${orders}" th:if="${o.status.name()=='PREPARING'}" th:href="@{/admin/pedidos/{id}(id=${o.id})}"><div><strong th:text="${o.number()}"></strong><span class="status-pill" th:text="${o.statusLabel()}"></span></div><span class="order-card-price" th:text="${#numbers.formatCurrency(o.total)}"></span><small><svg th:replace="~{fragments :: icon('clock','')}"></svg><span th:text="${#temporals.format(o.createdAt,'HH:mm')}"></span></small></a><p class="column-empty">Nenhum pedido nesta etapa.</p></div>
<div class="order-column" data-board-column="delivery"><h3><span><svg th:replace="~{fragments :: icon('truck','')}"></svg>Prontos / entrega</span><b th:text="${#lists.size(orders.?[status.name() == 'READY' or status.name() == 'OUT_FOR_DELIVERY'])}"></b></h3><a class="order-card" th:each="o:${orders}" th:if="${o.status.name()=='READY' or o.status.name()=='OUT_FOR_DELIVERY'}" th:href="@{/admin/pedidos/{id}(id=${o.id})}"><div><strong th:text="${o.number()}"></strong><span class="status-pill" th:text="${o.statusLabel()}"></span></div><span class="order-card-price" th:text="${#numbers.formatCurrency(o.total)}"></span><small><svg th:replace="~{fragments :: icon('clock','')}"></svg><span th:text="${#temporals.format(o.createdAt,'HH:mm')}"></span></small></a><p class="column-empty">Nenhum pedido nesta etapa.</p></div>
<div class="order-column" data-board-column="done"><h3><span><svg th:replace="~{fragments :: icon('circle-check','')}"></svg>Concluídos</span><b th:text="${#lists.size(orders.?[status.name() == 'DELIVERED' or status.name() == 'CANCELLED'])}"></b></h3><a class="order-card" th:each="o:${orders}" th:if="${o.status.name()=='DELIVERED' or o.status.name()=='CANCELLED'}" th:href="@{/admin/pedidos/{id}(id=${o.id})}"><div><strong th:text="${o.number()}"></strong><span class="status-pill" th:text="${o.statusLabel()}"></span></div><span class="order-card-price" th:text="${#numbers.formatCurrency(o.total)}"></span><small><svg th:replace="~{fragments :: icon('clock','')}"></svg><span th:text="${#temporals.format(o.createdAt,'HH:mm')}"></span></small></a><p class="column-empty">Nenhum pedido nesta etapa.</p></div></section>
</main></div></body></html>
