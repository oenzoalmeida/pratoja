<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto — Admin PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/admin-ui.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('products')}"></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">Cardápio</span><h1 th:text="${product.id==null?'Novo produto':'Editar produto'}"></h1></div><a class="back" href="/admin/produtos"><svg th:replace="~{fragments :: icon('arrow-left','')}"></svg>Voltar</a></header><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div>
<form action="/admin/produtos/salvar" method="post" enctype="multipart/form-data" class="admin-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:value="${product.id}"><label>Nome<input name="name" required maxlength="120" th:value="${product.name}" placeholder="Nome do produto"></label><label>Categoria<select name="categoryId" required><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category!=null and product.category.id==c.id}"></option></select></label><label class="span-2">Descrição<textarea name="description" required maxlength="600" th:text="${product.description}" placeholder="Descreva ingredientes e diferenciais"></textarea></label><label>Preço<input type="number" name="price" required step="0.01" min="0" th:value="${product.price}" placeholder="0,00"></label><label>Foto<input type="file" name="image" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG ou WebP. A imagem atual será mantida se nenhum arquivo for enviado.</small></label>
<fieldset class="span-2 form-options"><legend>Exibição e venda</legend><label class="check"><input type="checkbox" name="available" value="true" th:checked="${product.id==null or product.available}"><span><strong>Disponível</strong><small>Pode ser comprado no cardápio</small></span></label><label class="check"><input type="checkbox" name="featured" value="true" th:checked="${product.featured}"><span><strong>Destaque na home</strong><small>Aparece entre os mais pedidos</small></span></label><label class="check"><input type="checkbox" name="customizable" value="true" th:checked="${product.customizable}"><span><strong>Personalizável</strong><small>Abre o fluxo de escolhas</small></span></label></fieldset><div class="span-2 form-actions"><a class="btn btn-ghost" href="/admin/produtos">Cancelar</a><button class="btn btn-primary btn-lg"><svg th:replace="~{fragments :: icon('save','')}"></svg>Salvar produto</button></div></form>
</main></div></body></html>
