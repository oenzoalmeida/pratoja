<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio — Admin PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/admin-ui.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('products')}"></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">Cardápio</span><h1>Produtos e categorias</h1></div><a class="btn btn-primary" href="/admin/produtos/novo"><svg th:replace="~{fragments :: icon('plus','')}"></svg>Novo produto</a></header><div class="alert success" th:if="${success}"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg><span th:text="${success}"></span></div><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div>
<div class="admin-toolbar"><label class="search admin-search"><svg th:replace="~{fragments :: icon('search','')}"></svg><input type="search" data-table-filter placeholder="Buscar produto ou categoria..." aria-label="Buscar produtos"></label><span class="toolbar-count" th:text="${products.size()}+' produtos'"></span></div>
<div class="table-wrap responsive-table"><table class="data-table" data-filter-table><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Disponibilidade</th><th>Ações</th></tr></thead><tbody><tr th:each="p:${products}"><td data-label="Produto"><strong th:text="${p.name}"></strong></td><td data-label="Categoria" th:text="${p.category.name}"></td><td data-label="Preço" class="table-price" th:text="${#numbers.formatCurrency(p.price)}"></td><td data-label="Disponibilidade"><span class="status-pill" th:classappend="${!p.available} ? unavailable" th:text="${p.available?'Disponível':'Indisponível'}"></span></td><td data-label="Ações" class="actions"><a class="action-btn" th:href="@{/admin/produtos/{id}/editar(id=${p.id})}"><svg th:replace="~{fragments :: icon('pencil','')}"></svg>Editar</a><form th:action="@{/admin/produtos/{id}/disponibilidade(id=${p.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="action-btn"><svg th:replace="~{fragments :: icon(${p.available} ? 'circle-x' : 'circle-check','')}"></svg><span th:text="${p.available ? 'Indisponibilizar' : 'Disponibilizar'}"></span></button></form><form th:action="@{/admin/produtos/{id}/excluir(id=${p.id})}" method="post" data-confirm="Arquivar este produto? Ele deixará de aparecer no cardápio."><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="action-btn danger"><svg th:replace="~{fragments :: icon('trash','')}"></svg>Excluir</button></form></td></tr></tbody></table><p class="table-no-results" hidden><svg th:replace="~{fragments :: icon('search','')}"></svg>Nenhum produto corresponde à busca.</p></div>
<div class="section-bar"><div><span class="section-kicker">Organização</span><h2>Categorias</h2></div></div><section class="panel category-panel"><form action="/admin/categorias" method="post" class="category-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nome<input name="name" required placeholder="Nova categoria"></label><label>Ordem<input type="number" name="sortOrder" value="0"></label><button class="btn btn-dark"><svg th:replace="~{fragments :: icon('plus','')}"></svg>Adicionar</button></form><div class="category-tags"><span th:each="c:${categories}"><svg th:replace="~{fragments :: icon('tags','')}"></svg><strong th:text="${c.name}"></strong><form th:action="@{/admin/categorias/{id}/status(id=${c.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="action-btn compact"><svg th:replace="~{fragments :: icon(${c.active} ? 'circle-x' : 'circle-check','')}"></svg><span th:text="${c.active?'Desativar':'Ativar'}"></span></button></form></span></div></section>
</main></div></body></html>
