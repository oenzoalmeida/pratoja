<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios — Admin PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/admin-ui.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('reports')}"></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">Resultados</span><h1>Relatório de vendas</h1></div></header>
<section class="metrics report-metrics"><article class="metric"><span class="metric-icon"><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg></span><div><span>Pedidos concluídos</span><strong th:text="${orders.size()}"></strong></div></article><article class="metric"><span class="metric-icon"><svg th:replace="~{fragments :: icon('chart','')}"></svg></span><div><span>Faturamento</span><strong th:text="${#numbers.formatCurrency(revenue)}"></strong></div></article><article class="metric"><span class="metric-icon"><svg th:replace="~{fragments :: icon('banknote','')}"></svg></span><div><span>Ticket médio</span><strong th:text="${#numbers.formatCurrency(ticket)}"></strong></div></article></section>
<div class="section-bar"><div><span class="section-kicker">Desempenho</span><h2>Produtos mais vendidos</h2></div></div><section class="panel ranking-panel"><div class="ranking" th:each="item,stat:${top}"><b th:text="${stat.count}"></b><span th:text="${item.key}"></span><strong th:text="${item.value}+' un.'"></strong></div><div class="empty-inline" th:if="${top.empty}"><svg th:replace="~{fragments :: icon('chart','')}"></svg><div><strong>Nenhuma venda concluída ainda</strong><p>Os produtos mais vendidos aparecerão aqui.</p></div></div></section>
</main></div></body></html>
