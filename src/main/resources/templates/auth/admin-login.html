<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Administração — '+${store.name}">Administração</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/redesign.css"><link rel="stylesheet" href="/css/premium.css"><link rel="stylesheet" href="/css/auth.css"></head>
<body class="auth-page admin-auth"><main class="auth-wrap"><a class="brand" href="/"><span class="brand-mark">P</span><span>Prato<span>Já</span></span></a><aside th:replace="~{auth/parts :: scene}"></aside><section class="auth-card"><span class="auth-icon"><svg th:replace="~{fragments :: icon('layout-dashboard','')}"></svg></span><span class="eyebrow">Área restrita</span><h1>Painel do restaurante</h1><p>Gerencie pedidos, cardápio e resultados.</p><div class="alert error" th:if="${param.error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg>Credenciais inválidas.</div><div class="alert error" th:if="${param.limite != null}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg>Muitas tentativas de login. Aguarde alguns minutos e tente novamente.</div><form action="/login" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>E-mail administrativo<input type="email" name="email" required></label><label>Senha<input type="password" name="password" required></label><label class="remember-me"><input type="checkbox" name="remember-me" value="true"> Manter conectado</label><button class="btn btn-dark btn-lg full"><svg th:replace="~{fragments :: icon('layout-dashboard','')}"></svg>Acessar painel</button></form><div class="demo-box"><strong>Acesso restrito</strong><span>O acesso administrativo é provisionado internamente.</span></div></section></main><script src="/js/password-eyes.js" defer></script></body></html>
