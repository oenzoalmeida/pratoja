<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — PratoJá</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="auth-page admin-auth"><main class="auth-wrap"><a class="brand" href="/"><span class="brand-mark">P</span><span>Prato<span>Já</span></span></a><section class="auth-card"><span class="auth-icon"><svg th:replace="~{fragments :: icon('layout-dashboard','')}"></svg></span><span class="eyebrow">Área restrita</span><h1>Painel do restaurante</h1><p>Gerencie pedidos, cardápio e resultados.</p><div class="alert error" th:if="${param.error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg>Credenciais inválidas.</div><form action="/login" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>E-mail administrativo<input type="email" name="email" required value="admin@pratoja.com.br"></label><label>Senha<input type="password" name="password" required></label><button class="btn btn-dark btn-lg full"><svg th:replace="~{fragments :: icon('layout-dashboard','')}"></svg>Acessar painel</button></form><div class="demo-box"><strong>Acesso de demonstração</strong><span>admin@pratoja.com.br · Admin@123</span></div></section></main></body></html>
