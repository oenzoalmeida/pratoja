<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Crie sua senha definitiva — '+${store.name}">Crie sua senha definitiva</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/redesign.css"></head><body class="auth-page"><main class="auth-wrap"><section class="auth-card"><span class="auth-icon"><svg th:replace="~{fragments :: icon('save','')}"></svg></span><span class="eyebrow">Primeiro acesso</span><h1>Crie sua senha definitiva</h1><p>Por segurança, você precisa trocar a senha temporária antes de continuar.</p><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div><form action="/trocar-senha" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Senha temporária<input type="password" name="currentPassword" required autocomplete="current-password"></label><label>Nova senha<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Confirmar nova senha<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></label><button class="btn btn-primary btn-lg full"><svg th:replace="~{fragments :: icon('save','')}"></svg>Definir nova senha</button></form><form action="/logout" method="post" class="logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline full"><svg th:replace="~{fragments :: icon('log-out','')}"></svg>Sair e trocar de conta</button></form></section></main></body></html>
