<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha — PratoJá</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth-page"><main class="auth-wrap"><section class="auth-card"><span class="auth-icon"><svg th:replace="~{fragments :: icon('refresh','')}"></svg></span><span class="eyebrow">Recuperação segura</span><h1>Esqueceu a senha?</h1><p>Informe seu e-mail para gerar um link temporário.</p><div class="alert success" th:if="${success}"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg><span th:text="${success}"></span></div><a th:if="${demoLink}" class="demo-reset inline-action" th:href="${demoLink}">Abrir link de redefinição <svg th:replace="~{fragments :: icon('arrow-right','')}"></svg></a><form action="/recuperar-senha" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>E-mail<input type="email" name="email" required></label><button class="btn btn-primary btn-lg full"><svg th:replace="~{fragments :: icon('refresh','')}"></svg>Gerar link</button></form><p class="auth-switch"><a class="back" href="/login"><svg th:replace="~{fragments :: icon('arrow-left','')}"></svg>Voltar ao login</a></p></section></main></body></html>
