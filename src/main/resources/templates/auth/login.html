<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — PratoJá</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth-page"><main class="auth-wrap"><a class="brand" href="/"><span class="brand-mark">P</span><span>Prato<span>Já</span></span></a><section class="auth-card"><span class="auth-icon"><svg th:replace="~{fragments :: icon('user','')}"></svg></span><span class="eyebrow">Que bom ter você aqui</span><h1>Entre na sua conta</h1><p>Continue seu pedido e acompanhe tudo de perto.</p><div class="alert error" th:if="${param.error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg>E-mail ou senha incorretos.</div><div class="alert success" th:if="${success}"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg><span th:text="${success}"></span></div><form action="/login" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>E-mail<input type="email" name="email" required autocomplete="email" placeholder="voce@email.com"></label><label>Senha<input type="password" name="password" required autocomplete="current-password" placeholder="Sua senha"></label><a class="form-link" href="/recuperar-senha">Esqueci minha senha</a><button class="btn btn-primary btn-lg full"><svg th:replace="~{fragments :: icon('user','')}"></svg>Entrar</button></form><p class="auth-switch">Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p><div class="demo-box"><strong>Acesso de demonstração</strong><span>cliente@pratoja.com.br · Cliente@123</span></div></section></main></body></html>
