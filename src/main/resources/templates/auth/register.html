<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Cadastro — '+${store.name}">Cadastro</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/redesign.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><main class="auth-wrap wide"><a class="brand" href="/"><span class="brand-mark" th:text="${#strings.toUpperCase(#strings.substring(store.name,0,1))}">R</span><span th:text="${store.name}">Restaurante</span></a><section class="auth-card"><span class="auth-icon"><svg th:replace="~{fragments :: icon('user','')}"></svg></span><span class="eyebrow">Comece agora</span><h1>Crie sua conta</h1><p>Leva um minuto. Depois é só escolher o prato.</p><div class="alert error" role="alert" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div><form action="/cadastro" method="post" data-auth-form><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field" data-field><label for="name">Nome completo</label><div class="field-box"><svg th:replace="~{auth/parts :: person}"></svg><input id="name" name="name" required minlength="3" autocomplete="name" th:value="${name}" placeholder="Como você se chama" data-rule="name" aria-describedby="name-erro"></div><p class="field-error" id="name-erro" role="alert"></p></div>
<div class="form-row"><div class="field" data-field><label for="email">E-mail</label><div class="field-box"><svg th:replace="~{auth/parts :: mail}"></svg><input id="email" type="email" name="email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" th:value="${email}" placeholder="voce@email.com" data-rule="email" aria-describedby="email-erro"></div><p class="field-error" id="email-erro" role="alert"></p></div>
<div class="field" data-field><label for="phone">Telefone</label><div class="field-box"><svg th:replace="~{auth/parts :: phone}"></svg><input id="phone" name="phone" required autocomplete="tel" inputmode="tel" th:value="${phone}" placeholder="(11) 99999-9999" data-rule="phone" aria-describedby="phone-erro"></div><p class="field-error" id="phone-erro" role="alert"></p></div></div>
<div class="form-row"><div class="field" data-field><label for="password">Senha</label><div class="field-box"><svg th:replace="~{auth/parts :: lock}"></svg><input id="password" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Crie uma senha" data-rule="newpassword" aria-describedby="password-erro password-dica"><button type="button" class="pw-toggle" data-pw-toggle aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div><p class="field-error" id="password-erro" role="alert"></p></div>
<div class="field" data-field><label for="confirmPassword">Confirmar senha</label><div class="field-box"><svg th:replace="~{auth/parts :: lock}"></svg><input id="confirmPassword" type="password" name="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Repita a senha" data-rule="confirm" aria-describedby="confirmPassword-erro"><button type="button" class="pw-toggle" data-pw-toggle aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div><p class="field-error" id="confirmPassword-erro" role="alert"></p></div></div>
<small class="field-hint" id="password-dica">Use 8 ou mais caracteres, com maiúscula, minúscula e número.</small><div class="auth-actions"><button class="btn btn-primary btn-lg">Criar conta</button><a class="btn btn-ghost btn-lg" href="/login">Já tenho conta</a></div></form><p class="auth-switch"><small>Seus dados (nome, e-mail, telefone e endereços) são usados apenas para sua conta e seus pedidos. <a href="/privacidade">Política de Privacidade</a></small></p></section></main><script src="/js/auth.js" defer></script></body></html>
