<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro — PratoJá</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth-page"><main class="auth-wrap wide"><a class="brand" href="/"><span class="brand-mark">P</span><span>Prato<span>Já</span></span></a><section class="auth-card"><span class="auth-icon"><svg th:replace="~{fragments :: icon('user','')}"></svg></span><span class="eyebrow">Comece agora</span><h1>Crie sua conta</h1><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div><form action="/cadastro" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nome completo<input name="name" required minlength="3" th:value="${name}"></label><div class="form-row"><label>E-mail<input type="email" name="email" required th:value="${email}"></label><label>Telefone<input name="phone" required th:value="${phone}" placeholder="(11) 99999-9999"></label></div><div class="form-row"><label>Senha<input type="password" name="password" required minlength="8"></label><label>Confirmar senha<input type="password" name="confirmPassword" required minlength="8"></label></div><small>Use 8 ou mais caracteres, com maiúscula, minúscula e número.</small><button class="btn btn-primary btn-lg full"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg>Criar conta</button></form><p class="auth-switch">Já tem conta? <a href="/login">Entrar</a></p></section></main></body></html>
