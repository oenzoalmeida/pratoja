<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha — PratoJá</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth-page"><main class="auth-wrap"><section class="auth-card"><span class="auth-icon"><svg th:replace="~{fragments :: icon('save','')}"></svg></span><span class="eyebrow">Último passo</span><h1>Crie uma nova senha</h1><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div><form action="/redefinir-senha" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${token}"><label>Nova senha<input type="password" name="password" required minlength="8"></label><label>Confirmar senha<input type="password" name="confirmPassword" required minlength="8"></label><button class="btn btn-primary btn-lg full"><svg th:replace="~{fragments :: icon('save','')}"></svg>Salvar nova senha</button></form></section></main></body></html>
