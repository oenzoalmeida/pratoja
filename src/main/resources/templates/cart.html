<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sacola — PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script><script defer src="/js/cart.js"></script></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell cart-page"><div class="page-intro"><span class="eyebrow">Quase lá</span><h1>Sua sacola</h1></div>
<div class="alert success" th:if="${success}"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg><span th:text="${success}"></span></div><form id="csrf-form" hidden><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form>
<section class="empty" th:if="${cart.lines.empty}"><span class="empty-icon"><svg th:replace="~{fragments :: icon('shopping-bag','')}"></svg></span><h2>Sua sacola está vazia</h2><p>Que tal escolher algo gostoso?</p><a class="btn btn-primary" href="/cardapio"><svg th:replace="~{fragments :: icon('utensils','')}"></svg>Ver cardápio</a></section>
<div class="cart-layout" th:unless="${cart.lines.empty}"><section class="cart-items"><article class="cart-item" th:each="item:${cart.lines}" th:data-key="${item.key}">
<div class="cart-thumb"><img th:src="${item.imagePath}" onerror="this.onerror=null;this.src='/images/placeholder.jpg'" th:alt="${item.productName}"></div><div class="cart-content"><div class="cart-title-row"><h2 th:text="${item.productName}"></h2><strong th:text="${#numbers.formatCurrency(item.total())}"></strong></div><p th:if="${!item.choices.empty}" th:text="${#strings.listJoin(item.choices.![name], ', ')}"></p><small th:if="${!#strings.isEmpty(item.notes)}" th:text="'Obs.: '+${item.notes}"></small><div class="cart-controls"><div class="quantity small"><button type="button" data-cart-minus aria-label="Diminuir quantidade"><svg th:replace="~{fragments :: icon('minus','')}"></svg></button><input th:value="${item.quantity}" readonly aria-label="Quantidade"><button type="button" data-cart-plus aria-label="Aumentar quantidade"><svg th:replace="~{fragments :: icon('plus','')}"></svg></button></div><button type="button" class="text-danger action-with-icon" data-remove><svg th:replace="~{fragments :: icon('trash','')}"></svg>Remover</button></div></div>
</article><label class="cart-notes"><span><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg>Observações gerais</span><textarea data-cart-notes maxlength="600" th:text="${cart.notes}" placeholder="Alguma orientação para a cozinha?"></textarea><small>As alterações são salvas automaticamente.</small></label></section>
<aside class="cart-summary"><div class="summary-title"><svg th:replace="~{fragments :: icon('shopping-bag','')}"></svg><h2>Resumo</h2></div><div><span>Subtotal</span><strong data-subtotal th:text="${#numbers.formatCurrency(cart.subtotal())}"></strong></div><div><span>Entrega</span><span class="summary-note">Calculada no checkout</span></div><hr><div class="total"><span>Total parcial</span><strong data-total th:text="${#numbers.formatCurrency(cart.subtotal())}"></strong></div><a class="btn btn-primary btn-lg full" href="/checkout">Ir para o checkout <svg th:replace="~{fragments :: icon('arrow-right','')}"></svg></a><a class="continue" href="/cardapio"><svg th:replace="~{fragments :: icon('arrow-left','')}"></svg>Continuar comprando</a></aside></div>
</main><nav th:replace="~{fragments :: mobileNav}"></nav></body></html>
