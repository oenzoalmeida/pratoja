<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar pedido — PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/checkout.js"></script></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell checkout-page"><div class="page-intro"><span class="eyebrow">Finalize seu pedido</span><h1>Checkout</h1></div><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div>
<form action="/checkout" method="post" class="checkout-layout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="checkout-fields">
<section class="checkout-card"><div class="card-heading"><span class="heading-icon"><svg th:replace="~{fragments :: icon('truck','')}"></svg></span><div><small>Etapa 1</small><h2>Como você quer receber?</h2></div></div><div class="choice-grid"><label class="choice"><input type="radio" name="fulfillment" value="DELIVERY" checked><span><svg th:replace="~{fragments :: icon('truck','')}"></svg><strong>Entrega</strong><small>Receba no seu endereço</small><i><svg th:replace="~{fragments :: icon('check','')}"></svg></i></span></label><label class="choice"><input type="radio" name="fulfillment" value="PICKUP"><span><svg th:replace="~{fragments :: icon('store','')}"></svg><strong>Retirada</strong><small>Retire no restaurante</small><i><svg th:replace="~{fragments :: icon('check','')}"></svg></i></span></label></div>
<div data-addresses class="address-section"><h3><svg th:replace="~{fragments :: icon('map-pin','')}"></svg>Endereço de entrega</h3><div class="address-choice" th:each="a:${addresses}"><label><input type="radio" name="addressId" th:value="${a.id}" th:checked="${a.primaryAddress}"><span><strong th:text="${a.label}"></strong><small th:text="${a.formatted()}"></small></span><svg th:replace="~{fragments :: icon('check','selection-check')}"></svg></label></div><a class="inline-action" href="/perfil" th:if="${addresses.empty}"><svg th:replace="~{fragments :: icon('plus','')}"></svg>Cadastre um endereço para continuar</a></div></section>
<section class="checkout-card"><div class="card-heading"><span class="heading-icon"><svg th:replace="~{fragments :: icon('credit-card','')}"></svg></span><div><small>Etapa 2</small><h2>Forma de pagamento</h2></div></div><div class="choice-grid payments">
<label class="choice"><input type="radio" name="paymentMethod" value="PIX" checked><span><svg th:replace="~{fragments :: icon('qr-code','')}"></svg><strong>PIX</strong><small>Confirmação simulada</small><i><svg th:replace="~{fragments :: icon('check','')}"></svg></i></span></label><label class="choice"><input type="radio" name="paymentMethod" value="CARD"><span><svg th:replace="~{fragments :: icon('credit-card','')}"></svg><strong>Cartão</strong><small>Pagamento simulado</small><i><svg th:replace="~{fragments :: icon('check','')}"></svg></i></span></label><label class="choice"><input type="radio" name="paymentMethod" value="CASH"><span><svg th:replace="~{fragments :: icon('banknote','')}"></svg><strong>Dinheiro</strong><small>Pague na entrega</small><i><svg th:replace="~{fragments :: icon('check','')}"></svg></i></span></label></div>
<label data-change hidden>Troco para quanto?<input name="changeFor" inputmode="decimal" placeholder="Ex.: 100,00"></label><p class="demo-note"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg>Ambiente acadêmico: nenhuma cobrança real será realizada.</p></section>
<section class="checkout-card"><div class="card-heading"><span class="heading-icon"><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg></span><div><small>Etapa 3</small><h2>Observações</h2></div></div><textarea name="notes" maxlength="600" th:text="${cart.notes}" placeholder="Alguma observação sobre o pedido?"></textarea></section></div>
<aside class="cart-summary checkout-summary"><div class="summary-title"><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg><h2>Seu pedido</h2></div><div class="summary-item" th:each="item:${cart.lines}"><span th:text="${item.quantity}+'× '+${item.productName}"></span><strong th:text="${#numbers.formatCurrency(item.total())}"></strong></div><hr><div><span>Subtotal</span><strong th:text="${#numbers.formatCurrency(cart.subtotal())}"></strong></div><div><span>Taxa de entrega</span><strong data-fee th:data-fee="${deliveryFee}" th:text="${#numbers.formatCurrency(deliveryFee)}"></strong></div><hr><div class="total"><span>Total</span><strong data-checkout-total th:data-subtotal="${cart.subtotal()}" th:text="${#numbers.formatCurrency(cart.subtotal().add(deliveryFee))}"></strong></div><button class="btn btn-primary btn-lg full"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg>Confirmar pedido</button><a class="continue" href="/carrinho"><svg th:replace="~{fragments :: icon('arrow-left','')}"></svg>Voltar à sacola</a></aside>
</form></main><nav th:replace="~{fragments :: mobileNav}"></nav></body></html>
