<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monte seu prato — PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell custom-page"><div class="page-intro"><span class="eyebrow">Você escolhe cada detalhe</span><h1>Monte seu prato</h1><p>Combine seus favoritos. O valor é atualizado a cada escolha.</p></div>
<form class="builder add-cart-form" th:data-product="${product.id}" th:data-base-price="${product.price}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="builder-groups"><fieldset th:each="gv:${groups}" th:data-min="${gv.group.minSelections}" th:data-max="${gv.group.maxSelections}"><legend><span th:text="${gv.group.sortOrder}">1</span><span><strong th:text="${gv.group.name}"></strong><small th:text="${gv.group.minSelections > 0 ? 'Escolha obrigatória' : 'Opcional · até '+gv.group.maxSelections}"></small></span></legend><label class="option-row" th:each="o:${gv.options}"><input th:type="${gv.group.maxSelections == 1} ? 'radio' : 'checkbox'" th:name="'group-'+${gv.group.id}" name="options" th:value="${o.id}" th:data-price="${o.priceDelta}" th:disabled="${!o.available}"><span><strong th:text="${o.name}"></strong><small th:text="${o.priceDelta.signum() > 0 ? '+ '+#numbers.formatCurrency(o.priceDelta) : 'Incluso'}"></small></span><i class="option-check"><svg th:replace="~{fragments :: icon('check','')}"></svg></i></label></fieldset><label class="builder-notes"><span><svg th:replace="~{fragments :: icon('clipboard-list','')}"></svg>Observações</span><textarea name="notes" maxlength="400" placeholder="Conte para a cozinha como você prefere..."></textarea></label></div>
<aside class="builder-summary"><span>Seu prato a partir de</span><strong data-builder-total th:text="${#numbers.formatCurrency(product.price)}"></strong><p data-selection-summary>Faça suas escolhas para continuar.</p><button class="btn btn-primary btn-lg full" type="submit"><svg th:replace="~{fragments :: icon('shopping-bag','')}"></svg>Adicionar à sacola</button></aside></form>
</main><nav th:replace="~{fragments :: mobileNav}"></nav></body></html>
