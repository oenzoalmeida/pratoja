<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus pedidos — PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell"><div class="page-intro"><span class="eyebrow">Seus sabores favoritos</span><h1>Histórico de pedidos</h1></div>
<section class="empty" th:if="${orders.empty}"><span class="empty-icon"><svg th:replace="~{fragments :: icon('history','')}"></svg></span><h2>Você ainda não fez pedidos</h2><p>Seus pedidos aparecerão aqui para você acompanhar ou repetir.</p><a class="btn btn-primary" href="/cardapio"><svg th:replace="~{fragments :: icon('utensils','')}"></svg>Conhecer o cardápio</a></section>
<div class="history-list"><article class="history-card" th:each="o:${orders}"><div class="history-head"><div><span class="order-label">Pedido</span><strong th:text="${o.number()}"></strong></div><small><svg th:replace="~{fragments :: icon('clock','')}"></svg><span th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy · HH:mm')}"></span></small></div><div class="history-status"><span class="status-pill" th:text="${o.statusLabel()}"></span><strong th:text="${#numbers.formatCurrency(o.total)}"></strong></div><p th:text="${#strings.listJoin(o.items.![quantity+'× '+name],', ')}"></p><div class="history-actions"><a class="btn btn-outline" th:href="@{/pedidos/{id}/acompanhar(id=${o.id})}"><svg th:replace="~{fragments :: icon('eye','')}"></svg>Ver detalhes</a><form th:action="@{/pedidos/{id}/repetir(id=${o.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-primary"><svg th:replace="~{fragments :: icon('refresh','')}"></svg>Pedir novamente</button></form></div></article></div>
</main><nav th:replace="~{fragments :: mobileNav}"></nav></body></html>
