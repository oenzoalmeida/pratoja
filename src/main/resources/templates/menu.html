<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" th:content="'Cardápio completo do ' + store.name + ' — peça online com entrega rápida.'"><link rel="canonical" th:href="${siteBaseUrl + '/loja/' + store.slug + '/cardapio'}"><title th:text="'Cardápio — '+${store.name}">Cardápio</title><th:block th:replace="~{fragments :: storeHead}"></th:block><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/redesign.css"><script defer src="/js/app.js"></script></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell menu-page">
<section class="page-intro"><span class="eyebrow">Cardápio completo</span><h1>O que vai ser <em>hoje</em>?</h1><p>Receitas preparadas na hora, com ingredientes frescos.</p></section>
<form class="menu-tools" th:action="@{/loja/{slug}/cardapio(slug=${store.slug})}"><label class="search"><svg th:replace="~{fragments :: icon('search','')}"></svg><input name="q" th:value="${q}" placeholder="Buscar pratos, bebidas..." aria-label="Buscar produtos"></label><div class="chips" aria-label="Categorias"><a th:classappend="${selectedCategory == null} ? active" th:href="@{/loja/{slug}/cardapio(slug=${store.slug})}">Todos</a><a th:each="c:${categories}" th:classappend="${selectedCategory == c.id} ? active" th:href="@{/loja/{slug}/cardapio(slug=${store.slug},categoria=${c.id})}" th:text="${c.name}">Categoria</a></div></form>
<section class="empty" th:if="${#lists.isEmpty(products)}"><span class="empty-icon"><svg th:replace="~{fragments :: icon('utensils','')}"></svg></span><h2>Nenhum prato encontrado</h2><p>Tente outro termo ou remova os filtros.</p><a class="btn btn-outline" th:href="@{/loja/{slug}/cardapio(slug=${store.slug})}"><svg th:replace="~{fragments :: icon('refresh','')}"></svg>Limpar filtros</a></section>
<section class="product-grid menu-grid"><article class="product-card" th:each="p:${products}" th:classappend="${!p.available} ? unavailable">
  <a class="product-main" th:href="@{/loja/{slug}/produto/{id}(slug=${store.slug},id=${p.id})}"><div class="product-image"><img th:src="${p.imagePath}" th:alt="${p.name}" onerror="this.onerror=null;this.src='/images/placeholder.jpg'"><span th:if="${!p.available}" class="soldout"><svg th:replace="~{fragments :: icon('circle-x','')}"></svg>Indisponível</span></div><div class="product-info"><small th:text="${p.category.name}"></small><h3 th:text="${p.name}"></h3><p th:text="${p.description}"></p></div></a>
  <div class="product-footer"><strong th:text="${'R$ ' + #numbers.formatDecimal(p.price,1,2,'COMMA')}"></strong><form th:if="${p.available and !p.customizable}" class="quick-add-form" th:data-product="${p.id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="product-action" type="submit"><svg th:replace="~{fragments :: icon('plus','')}"></svg>Adicionar</button></form><a th:if="${p.available and p.customizable}" class="product-action" th:href="@{/loja/{slug}/produto/{id}(slug=${store.slug},id=${p.id})}"><svg th:replace="~{fragments :: icon('chef-hat','')}"></svg>Personalizar</a><span th:unless="${p.available}" class="product-unavailable"><svg th:replace="~{fragments :: icon('circle-x','')}"></svg>Indisponível</span></div>
</article></section>
</main><footer th:replace="~{fragments :: footer}"></footer><nav th:replace="~{fragments :: mobileNav}"></nav><script>window.addEventListener('load',()=>{const out=[];for(const sh of document.styleSheets){try{for(const r of sh.cssRules){if(r.cssText&&r.cssText.includes('.product-image'))out.push(r.cssText.slice(0,220));if(r.media){for(const r2 of r.cssRules){if(r2.cssText&&r2.cssText.includes('.product-image'))out.push('@media '+r.conditionText+' :: '+r2.cssText.slice(0,220))}}}catch(e){}}const d=document.createElement('div');d.id='probe';d.textContent=out.join(' ### ');document.body.appendChild(d);})</script></body></html>
