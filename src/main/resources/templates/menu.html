<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio — PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell">
<section class="page-intro"><span class="eyebrow">Escolha seu favorito</span><h1>Nosso cardápio</h1><p>Receitas preparadas na hora, com ingredientes frescos.</p></section>
<form class="menu-tools" action="/cardapio"><label class="search"><svg th:replace="~{fragments :: icon('search','')}"></svg><input name="q" th:value="${q}" placeholder="Buscar pratos, bebidas..." aria-label="Buscar produtos"></label><div class="chips" aria-label="Categorias"><a th:classappend="${selectedCategory == null} ? active" href="/cardapio">Todos</a><a th:each="c:${categories}" th:classappend="${selectedCategory == c.id} ? active" th:href="@{/cardapio(categoria=${c.id})}" th:text="${c.name}">Categoria</a></div></form>
<section class="empty" th:if="${#lists.isEmpty(products)}"><span class="empty-icon"><svg th:replace="~{fragments :: icon('utensils','')}"></svg></span><h2>Nenhum prato encontrado</h2><p>Tente outro termo ou remova os filtros.</p><a class="btn btn-outline" href="/cardapio"><svg th:replace="~{fragments :: icon('refresh','')}"></svg>Limpar filtros</a></section>
<section class="product-grid menu-grid"><article class="product-card" th:each="p:${products}" th:classappend="${!p.available} ? unavailable">
  <a class="product-main" th:href="@{/produto/{id}(id=${p.id})}"><div class="product-image"><img th:src="${p.imagePath}" th:alt="${p.name}" onerror="this.onerror=null;this.src='/images/placeholder.jpg'"><span th:if="${!p.available}" class="soldout"><svg th:replace="~{fragments :: icon('circle-x','')}"></svg>Indisponível</span></div><div class="product-info"><small th:text="${p.category.name}"></small><h3 th:text="${p.name}"></h3><p th:text="${p.description}"></p></div></a>
  <div class="product-footer"><strong th:text="${#numbers.formatCurrency(p.price)}"></strong><form th:if="${p.available and !p.customizable}" class="quick-add-form" th:data-product="${p.id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="product-action" type="submit"><svg th:replace="~{fragments :: icon('plus','')}"></svg>Adicionar</button></form><a th:if="${p.available and p.customizable}" class="product-action" th:href="@{/produto/{id}(id=${p.id})}"><svg th:replace="~{fragments :: icon('chef-hat','')}"></svg>Personalizar</a><span th:unless="${p.available}" class="product-unavailable"><svg th:replace="~{fragments :: icon('circle-x','')}"></svg>Indisponível</span></div>
</article></section>
</main><footer th:replace="~{fragments :: footer}"></footer><nav th:replace="~{fragments :: mobileNav}"></nav></body></html>
