<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'Pagamento Pix — '+${store.name}">Pagamento Pix</title><th:block th:replace="~{fragments :: storeHead}"></th:block><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/redesign.css"></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell">
<section class="tracking-head"><div><span class="eyebrow" th:text="'Pedido '+${order.number()}">Pedido</span><h1>Pagamento via Pix</h1><p><svg th:replace="~{fragments :: icon('clock','')}"></svg><span>Escaneie o QR Code ou use o copia e cola para concluir.</span></p></div></section>
<div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div>
<div class="alert error" th:if="${testMode}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span>Ambiente de testes do Mercado Pago: nenhuma cobrança real é feita.</span></div>
<section class="panel" style="text-align:center">
  <div class="panel-heading" style="justify-content:center"><span class="heading-icon"><svg th:replace="~{fragments :: icon('qr-code','')}"></svg></span><div><small>Total</small><h2 th:text="${'R$ ' + #numbers.formatDecimal(order.total,1,2,'COMMA')}"></h2></div></div>
  <img th:if="${payment.qrCodeBase64 != null}" th:src="'data:image/png;base64,'+${payment.qrCodeBase64}" alt="QR Code Pix" width="260" height="260" style="margin:12px auto;display:block;max-width:100%">
  <p th:if="${payment.qrCode != null}" style="word-break:break-all;font-size:.85rem;background:#f6f6f6;padding:10px;border-radius:8px" th:text="${payment.qrCode}"></p>
  <p th:if="${payment.qrCode == null}">QR Code ainda não disponível. Use o botão de verificação abaixo em instantes.</p>
  <button class="btn btn-primary" type="button" th:if="${payment.qrCode != null}" data-copy><svg th:replace="~{fragments :: icon('copy','')}"></svg>Copiar código Pix</button>
  <p><span class="live"><i></i><span data-payment-status>Aguardando pagamento…</span></span></p>
  <form th:action="@{/loja/{slug}/pedidos/{id}/pagamento/verificar(slug=${store.slug},id=${order.id})}" method="post" style="margin-top:8px"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-ghost"><svg th:replace="~{fragments :: icon('refresh-cw','')}"></svg>Já paguei, verificar</button></form>
</section>
</main><nav th:replace="~{fragments :: mobileNav}"></nav>
<script th:inline="javascript">
(function(){
  var orderId = [[${order.id}]], slug = [[${store.slug}]];
  var btn = document.querySelector('[data-copy]');
  if (btn) btn.addEventListener('click', function(){
    navigator.clipboard.writeText([[${payment.qrCode}]]).then(function(){ btn.querySelector('span, svg') && (btn.lastChild.textContent = 'Copiado!'); });
  });
  setInterval(function(){
    fetch('/loja/' + slug + '/pedidos/' + orderId + '/pagamento/status').then(function(r){ return r.json(); }).then(function(d){
      var el = document.querySelector('[data-payment-status]');
      if (d.status === 'CONFIRMED') { window.location.href = '/loja/' + slug + '/pedidos/' + orderId + '/acompanhar'; return; }
      if (d.status === 'CANCELLED' && el) el.textContent = 'Pagamento cancelado ou estornado.';
    }).catch(function(){});
  }, 4000);
})();
</script>
</body></html>
