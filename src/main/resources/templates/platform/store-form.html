<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova loja — Plataforma</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{platform/fragments :: sidebar('new')}"></aside><main class="admin-main">
<header class="admin-top"><div><span class="eyebrow">Plataforma</span><h1>Nova loja</h1></div><a class="back" href="/platform"><svg th:replace="~{fragments :: icon('arrow-left','')}"></svg>Voltar</a></header>
<div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div>
<form th:action="@{/platform/lojas}" method="post" class="admin-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Nome da loja<input name="name" required minlength="2" maxlength="120" placeholder="Nome do restaurante"></label>
<label>Slug (URL /loja/{slug})<input name="slug" maxlength="80" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="gerado a partir do nome — editável"></label>
<label>Taxa de entrega (R$)<input type="number" name="deliveryFee" step="0.01" min="0" value="0.00"></label>
<label class="span-2">Slogan<input name="slogan" maxlength="200" placeholder="opcional"></label>
<div class="span-2 form-actions"><a class="btn btn-ghost" href="/platform">Cancelar</a><button class="btn btn-primary btn-lg"><svg th:replace="~{fragments :: icon('save','')}"></svg>Criar loja</button></div>
</form>
</main></div></body></html>
