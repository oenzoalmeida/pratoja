<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lojas — Plataforma</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head>
<body><div class="admin-shell"><aside th:replace="~{platform/fragments :: sidebar('stores')}"></aside><main class="admin-main">
<header class="admin-top"><div><span class="eyebrow">Plataforma</span><h1>Lojas</h1></div><a class="btn btn-primary" href="/platform/lojas/nova"><svg th:replace="~{fragments :: icon('plus','')}"></svg>Nova loja</a></header>
<div class="alert success" th:if="${success}"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg><span th:text="${success}"></span></div><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div>
<div class="table-wrap responsive-table"><table class="data-table"><thead><tr><th>Loja</th><th>Slug</th><th>Status</th><th>Produtos</th><th>Pedidos</th><th>Admins</th><th>Taxa</th><th>Criada em</th><th>Ações</th></tr></thead>
<tbody><tr th:each="row:${rows}">
<td data-label="Loja"><a class="table-link" th:href="@{/platform/lojas/{id}(id=${row.store.id})}" th:text="${row.store.name}"></a></td>
<td data-label="Slug"><code th:text="${row.store.slug}"></code></td>
<td data-label="Status"><span class="status-pill" th:text="${row.store.active} ? 'Ativa' : 'Inativa'"></span></td>
<td data-label="Produtos" th:text="${row.productCount}"></td>
<td data-label="Pedidos" th:text="${row.orderCount}"></td>
<td data-label="Admins" th:text="${row.adminCount}"></td>
<td data-label="Taxa" th:text="${#numbers.formatCurrency(row.store.deliveryFee)}"></td>
<td data-label="Criada em" th:text="${#temporals.format(row.store.createdAt,'dd/MM/yyyy')}"></td>
<td data-label="Ações"><form th:action="@{/platform/lojas/{id}/status(id=${row.store.id})}" method="post" data-confirm="Confirma alterar o status desta loja? O público em /loja/{slug} fica indisponível quando desativada."><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-ghost" th:text="${row.store.active} ? 'Desativar' : 'Ativar'"></button></form></td>
</tr><tr class="table-empty" th:if="${rows.empty}"><td colspan="9">Nenhuma loja cadastrada ainda.</td></tr></tbody></table></div>
</main></div></body></html>
