<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${product.name}+' — PratoJá'">Produto</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell">
<a class="back" href="/cardapio"><svg th:replace="~{fragments :: icon('arrow-left','')}"></svg>Voltar ao cardápio</a>
<section class="product-detail"><div class="detail-image"><img th:src="${product.imagePath}" th:alt="${product.name}" onerror="this.onerror=null;this.src='/images/placeholder.jpg'"><span th:if="${!product.available}" class="soldout"><svg th:replace="~{fragments :: icon('circle-x','')}"></svg>Indisponível</span></div>
<form class="detail-panel add-cart-form" th:data-product="${product.id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><small th:text="${product.category.name}"></small><h1 th:text="${product.name}"></h1><p th:text="${product.description}"></p><strong class="detail-price" th:text="${#numbers.formatCurrency(product.price)}"></strong>
<label>Alguma observação?<textarea name="notes" maxlength="400" placeholder="Ex.: sem cebola, molho à parte..."></textarea></label>
<div class="purchase-row"><div class="quantity" aria-label="Quantidade"><button type="button" data-minus aria-label="Diminuir quantidade"><svg th:replace="~{fragments :: icon('minus','')}"></svg></button><input name="quantity" value="1" readonly aria-label="Quantidade"><button type="button" data-plus aria-label="Aumentar quantidade"><svg th:replace="~{fragments :: icon('plus','')}"></svg></button></div><button class="btn btn-primary btn-lg purchase-cta" th:disabled="${!product.available}" type="submit"><svg th:replace="~{fragments :: icon('shopping-bag','')}"></svg><span th:text="${product.available} ? 'Adicionar à sacola' : 'Produto indisponível'"></span></button></div>
</form></section></main><nav th:replace="~{fragments :: mobileNav}"></nav></body></html>
