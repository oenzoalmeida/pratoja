<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil — PratoJá</title><link rel="stylesheet" href="/css/app.css"><script defer src="/js/app.js"></script></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell profile-page"><div class="page-intro"><span class="eyebrow">Sua conta</span><h1>Meu perfil</h1></div><div class="alert success" th:if="${success}"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg><span th:text="${success}"></span></div><div class="alert error" th:if="${error}"><svg th:replace="~{fragments :: icon('circle-alert','')}"></svg><span th:text="${error}"></span></div>
<div class="profile-grid"><section class="panel"><div class="panel-heading"><span class="heading-icon"><svg th:replace="~{fragments :: icon('user','')}"></svg></span><div><small>Conta</small><h2>Dados pessoais</h2></div></div><form action="/perfil" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nome<input name="name" required th:value="${user.name}"></label><label>E-mail<input disabled th:value="${user.email}"></label><label>Telefone<input name="phone" required th:value="${user.phone}"></label><button class="btn btn-primary"><svg th:replace="~{fragments :: icon('save','')}"></svg>Salvar alterações</button></form><form action="/logout" method="post" class="logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline"><svg th:replace="~{fragments :: icon('log-out','')}"></svg>Sair da conta</button></form></section>
<section class="panel"><div class="panel-heading"><span class="heading-icon"><svg th:replace="~{fragments :: icon('map-pin','')}"></svg></span><div><small>Entrega</small><h2>Endereços cadastrados</h2></div></div><div class="address-card" th:each="a:${addresses}"><div><strong th:text="${a.label}"></strong><span th:if="${a.primaryAddress}" class="badge"><svg th:replace="~{fragments :: icon('circle-check','')}"></svg>Principal</span><p th:text="${a.formatted()}"></p></div><form th:action="@{/perfil/enderecos/{id}/excluir(id=${a.id})}" method="post" data-confirm="Excluir este endereço?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-danger action-with-icon"><svg th:replace="~{fragments :: icon('trash','')}"></svg>Excluir</button></form></div><p class="muted-message" th:if="${addresses.empty}">Você ainda não cadastrou um endereço.</p>
<details class="address-form" open><summary><svg th:replace="~{fragments :: icon('plus','')}"></svg>Adicionar endereço</summary><form action="/perfil/enderecos" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-row"><label>Identificação<input name="label" required placeholder="Ex.: Casa"></label><label>CEP<input name="zipCode" required maxlength="9" placeholder="00000-000"></label></div><label>Rua<input name="street" required></label><div class="form-row"><label>Número<input name="number" required></label><label>Complemento<input name="complement"></label></div><div class="form-row"><label>Bairro<input name="neighborhood" required></label><label>Cidade<input name="city" required></label><label>UF<input name="state" required maxlength="2"></label></div><label class="check"><input type="checkbox" name="primaryAddress" value="true">Definir como principal</label><button class="btn btn-dark"><svg th:replace="~{fragments :: icon('save','')}"></svg>Salvar endereço</button></form></details></section></div>
</main><nav th:replace="~{fragments :: mobileNav}"></nav></body></html>
